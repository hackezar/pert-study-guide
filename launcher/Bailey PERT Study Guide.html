<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bailey's PERT Study Guide</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;
    font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f2fb;color:#1d1733;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#120f1c;color:#ece8f7}a{color:#b59bff}}
  main{max-width:30rem}
  h1{font-size:1.6rem;margin:0 0 .5rem}
  a{color:#6b3fd0;font-weight:700}
  p.small{font-size:.95rem;opacity:.75}
</style>
</head>
<body>
<main>
  <h1>Bailey's PERT Study Guide</h1>
  <p>Opening the newest version of your guide…</p>
  <p>If it does not open, <a id="go" href="https://hackezar.github.io/pert-study-guide/">tap here</a>.</p>
  <p class="small">This file always opens the latest version, so you never need a new copy. It needs internet the first time. After that the guide also works offline.</p>
</main>
<script>
  // Hands any progress saved by the old file version of the guide over to the online version.
  // The online guide only uses it if it has no progress of its own yet.
  var U = 'https://hackezar.github.io/pert-study-guide/', h = '';
  try { var old = localStorage.getItem('bsg3'); if (old) h = '#import=' + encodeURIComponent(old); } catch (e) {}
  document.getElementById('go').href = U + h;
  location.replace(U + h);
</script>
</body>
</html>
